<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Server Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
  button { margin: 5px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
  button:disabled { background-color: #ccc; cursor: not-allowed; }
  #status { margin-top: 20px; font-size: 18px; white-space: pre-wrap; }
  #ipbox { font-size: 16px; width: 200px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<h1>Minecraft Server Dashboard</h1>

<button id="startBtn" onclick="sendAction('start')">Start Server</button>
<button id="stopBtn" onclick="sendAction('stop')">Stop Server</button>
<button id="ipBtn" onclick="sendAction('ip')">Get IP</button>

<div id="status"></div>
<input type="text" id="ipbox" readonly placeholder="IP will appear here">

<script>
const LAMBDA_URL = 'https://sbt3ji4mrsyg4nixn7tqfnphoq0ztkri.lambda-url.us-west-2.on.aws/'; // <-- Replace with your Lambda Function URL

let isBusy = false;

async function sendAction(action) {
    if (isBusy) return;
    isBusy = true;

    // Disable buttons while working
    setButtonsDisabled(true);
    document.getElementById('status').textContent = 'Processing...';

    try {
        const response = await fetch(LAMBDA_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action })
        });

        const data = await response.json();
        document.getElementById('status').textContent = data.text;

        // Extract IP if present
        const ipMatch = data.text.match(/(\d+\.\d+\.\d+\.\d+)/);
        document.getElementById('ipbox').value = ipMatch ? ipMatch[0] : '';

    } catch (err) {
        document.getElementById('status').textContent = 'Error: ' + err;
        document.getElementById('ipbox').value = '';
    }

    setButtonsDisabled(false);
    isBusy = false;
}

function setButtonsDisabled(disabled) {
    document.getElementById('startBtn').disabled = disabled;
    document.getElementById('stopBtn').disabled = disabled;
    document.getElementById('ipBtn').disabled = disabled;
}
</script>
</body>
</html>
