<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fab Four Minecraft Server Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* General body */
  body {
    font-family: 'Press Start 2P', cursive;
    background: linear-gradient(to bottom, #1a1a1a, #111);
    color: #00ff00;
    text-align: center;
    margin: 0;
    padding: 50px 20px;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 40px;
    color: #00ff66;
    text-shadow: 2px 2px #000;
  }

  /* Buttons */
  button {
    background-color: #222;
    color: #00ff66;
    border: 2px solid #00ff66;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 14px;
    cursor: pointer;
    margin: 5px;
    transition: all 0.2s ease-in-out;
  }

  button:hover:not(:disabled) {
    background-color: #00ff66;
    color: #111;
    transform: scale(1.05);
  }

  button:disabled {
    background-color: #444;
    border-color: #555;
    color: #888;
    cursor: not-allowed;
  }

  /* Status panel */
  #status {
    margin-top: 30px;
    font-size: 14px;
    background-color: #111;
    border: 2px solid #00ff66;
    border-radius: 8px;
    padding: 15px;
    width: 400px;
    max-width: 90%;
    margin-left: auto;
    margin-right: auto;
    min-height: 60px;
    white-space: pre-wrap;
  }

  /* IP box */
  #ipbox {
    font-family: monospace;
    font-size: 14px;
    width: 220px;
    text-align: center;
    margin-top: 15px;
    padding: 8px;
    border: 2px solid #00ff66;
    border-radius: 6px;
    background-color: #111;
    color: #00ff66;
  }
</style>
</head>
<body>
<h1>Fab Four Minecraft Server Dashboard</h1>

<button id="startBtn" onclick="sendAction('start')">Start Server</button>
<button id="stopBtn" onclick="sendAction('stop')">Stop Server</button>
<button id="ipBtn" onclick="sendAction('ip')">Get IP</button>

<div id="status">Status will appear here...</div>
<input type="text" id="ipbox" readonly placeholder="IP will appear here">

<script>
const LAMBDA_URL = 'https://sbt3ji4mrsyg4nixn7tqfnphoq0ztkri.lambda-url.us-west-2.on.aws/';

let isBusy = false;

async function sendAction(action) {
    if (isBusy) return;
    isBusy = true;

    setButtonsDisabled(true);
    document.getElementById('status').textContent = 'Processing...';

    try {
        const response = await fetch(LAMBDA_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

        const data = await response.json();
        document.getElementById('status').textContent = data.text || '';

        const ipMatch = data.text.match(/(\d+\.\d+\.\d+\.\d+)/);
        document.getElementById('ipbox').value = ipMatch ? ipMatch[0] : '';

    } catch (err) {
        document.getElementById('status').textContent = 'Error: ' + err.message;
        document.getElementById('ipbox').value = '';
    }

    setButtonsDisabled(false);
    isBusy = false;
}

function setButtonsDisabled(disabled) {
    document.getElementById('startBtn').disabled = disabled;
    document.getElementById('stopBtn').disabled = disabled;
    document.getElementById('ipBtn').disabled = disabled;
}
</script>
</body>
</html>
